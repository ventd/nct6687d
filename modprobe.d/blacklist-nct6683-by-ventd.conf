# Installed by the ventd/nct6687d DKMS hook (see scripts/dkms-postinst.sh).
#
# The in-tree nct6683 driver claims the same NCT6687D chip ID at boot but is
# read-only: no pwm* write path, no pwm_enable, no fan curves. On boards
# fitted with the NCT6687D (most modern MSI desktops, some ASRock / Mitac)
# letting nct6683 bind first leaves the chip in a state where ventd's
# controller can see fan tachs but cannot write speeds. Blacklist it so the
# out-of-tree nct6687 driver gets the chip.
#
# To restore the upstream Linux behaviour, uninstall ventd/nct6687d (the
# DKMS PRE_REMOVE hook deletes this file), or `rm` this file by hand.
blacklist nct6683
